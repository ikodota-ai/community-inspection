<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - 社区隐患排查系统</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .glass-card { background: rgba(255,255,255,0.98); backdrop-filter: blur(12px); }
        .input-focus:focus { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.15); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<div id="app" class="max-w-md w-full">
    <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-blue-600 rounded-3xl shadow-2xl mb-6">
            <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
        </div>
        <h1 class="text-3xl font-extrabold text-white">社区隐患排查</h1>
        <p class="text-slate-400 text-sm mt-2">双林社区 · 微网格巡查系统</p>
    </div>
    <div class="glass-card rounded-[2.5rem] p-10 shadow-2xl">
        <form @submit.prevent="handleLogin" class="space-y-6">
            <div><label class="block text-xs font-bold text-slate-400 uppercase ml-1">账号</label>
                <input v-model="username" type="text" required class="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none input-focus" placeholder="微网格员账号">
            </div>
            <div><label class="block text-xs font-bold text-slate-400 uppercase ml-1">密码</label>
                <input v-model="password" type="password" required class="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none input-focus" placeholder="登录密码">
            </div>
            <div v-if="errorMsg" class="text-red-500 text-sm text-center bg-red-50 rounded-xl py-2">{{ errorMsg }}</div>
            <button type="submit" :disabled="loading" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-xl transition disabled:opacity-50">
                {{ loading ? '登录中...' : '进入系统' }}
            </button>
        </form>
    </div>
</div>
<script>
const { createApp, ref } = Vue;
// 自动使用当前域名，通过nginx代理到后端
const API = window.location.protocol + '//' + window.location.host;

createApp({
    setup() {
        const username = ref('');
        const password = ref('');
        const loading = ref(false);
        const errorMsg = ref('');
        const handleLogin = async () => {
            loading.value = true; errorMsg.value = '';
            try {
                // 先获取验证码状态
                const capRes = await fetch(API + '/captchaImage');
                const capData = await capRes.json();
                const body = { username: username.value, password: password.value, code: '1234', uuid: 'dev' };
                // 如果验证码关闭，传空
                if (!capData.captchaEnabled) { body.code = ''; body.uuid = ''; }
                
                const res = await fetch(API + '/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.code === 200 && data.token) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('username', username.value);
                    const returnUrl = localStorage.getItem('returnUrl');
                    localStorage.removeItem('returnUrl');
                    window.location.href = returnUrl || 'worker.html';
                } else {
                    errorMsg.value = data.msg || '登录失败';
                }
            } catch(e) { errorMsg.value = '网络连接失败: ' + e.message; }
            loading.value = false;
        };
        return { username, password, loading, errorMsg, handleLogin };
    }
}).mount('#app');
</script>
</body>
</html>
